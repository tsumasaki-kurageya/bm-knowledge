site_name: 建物維持保全 業務レビュー
site_description: 建物維持保全の全体像・業務領域・業務フローを読む
site_url: https://tsumasaki-kurageya.github.io/bm-knowledge/
repo_url: https://github.com/tsumasaki-kurageya/bm-knowledge
repo_name: GitHub
edit_uri: blob/main/docs/
docs_dir: .pages-docs
site_dir: site
use_directory_urls: false
theme:
  name: mkdocs
  locale: ja
  custom_dir: pages/theme
  color_mode: light
  navigation_depth: 2
  highlightjs: false
plugins:
  - search:
      lang: ja
markdown_extensions:
  - toc:
      permalink: true
      slugify: !!python/name:markdown.extensions.toc.slugify_unicode
  - tables
  - sane_lists
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
extra_css:
  - assets/review.css
extra_javascript:
  - assets/diagrams.mjs
validation:
  links:
    anchors: warn
    not_found: warn
    unrecognized_links: warn
