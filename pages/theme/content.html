{% if page.meta.id %}
<aside class="review-meta" aria-label="文書情報">
  <strong>{{ page.meta.id | e }}</strong>
  <span>状態: {{ page.meta.status | e }}</span>
  <span>信頼度: {{ page.meta.confidence | e }}</span>
  <span>確認日: {{ page.meta.last_reviewed | e }}</span>
  <a href="{{ page.edit_url | e }}">Markdown原文</a>
  <a href="{{ config.repo_url }}/issues/new?title={{ (page.meta.id ~ '：レビュー') | urlencode }}&amp;body={{ ('対象：docs/' ~ page.file.src_uri ~ '\n\n見出し：\n\n修正内容・理由：\n') | urlencode }}">修正を提案</a>
</aside>
{% endif %}
{{ page.content }}
